<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1525"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <!-- Cyan glow filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2744" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Right side radial glow -->
    <radialGradient id="rightGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Tag gradient (cyan to pink) -->
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#70a5fd"/>
      <stop offset="100%" stop-color="#bf91f3"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shieldGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bf91f3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bf91f3" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="shieldGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Scan line -->
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f7ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Subtle scan lines -->
  <rect x="0" y="60" width="1200" height="1" fill="url(#scanLine)"/>
  <rect x="0" y="120" width="1200" height="1" fill="url(#scanLine)"/>
  <rect x="0" y="180" width="1200" height="1" fill="url(#scanLine)"/>
  <rect x="0" y="240" width="1200" height="1" fill="url(#scanLine)"/>

  <!-- Right glow behind logo -->
  <circle cx="950" cy="150" r="180" fill="url(#rightGlow)"/>

  <!-- Terminal window border -->
  <rect x="30" y="25" width="700" height="250" rx="8" ry="8" fill="none" stroke="#1e3050" stroke-width="1.5" opacity="0.7"/>

  <!-- Terminal title bar -->
  <rect x="30" y="25" width="700" height="30" rx="8" ry="8" fill="#111b2e" opacity="0.8"/>
  <rect x="30" y="47" width="700" height="8" fill="#111b2e" opacity="0.8"/>

  <!-- Window dots -->
  <circle cx="52" cy="40" r="5.5" fill="#ff5f57"/>
  <circle cx="72" cy="40" r="5.5" fill="#febc2e"/>
  <circle cx="92" cy="40" r="5.5" fill="#a78bfa"/>

  <!-- ~/profile path -->
  <text x="115" y="44" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#5b8ab5" opacity="0.8">~/profile</text>

  <!-- > whoami -->
  <text x="55" y="100" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="15" fill="#5eead4">
    <tspan fill="#5b8ab5">&gt; </tspan>whoami
  </text>

  <!-- NEROPQ - main name -->
  <text x="55" y="165" font-family="'Inter', 'Segoe UI', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#e8edf3" letter-spacing="4">NEROPQ</text>

  <!-- Phan Thiện Quang - sub name -->
  <text x="58" y="200" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#8899aa" letter-spacing="5" font-weight="300">PHAN THIỆN QUANG</text>

  <!-- Tags at bottom -->
  <text x="55" y="252" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="600" letter-spacing="2" fill="url(#tagGrad)">RED TEAM / BLUE TEAM / CTF / AI</text>

  <!-- ============ RIGHT SIDE: Cybersecurity Shield Logo ============ -->
  <g transform="translate(950, 130)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1e3050" stroke-width="1" opacity="0.6"/>
    <!-- Tick marks on ring -->
    <g opacity="0.4" stroke="#2a4060" stroke-width="1">
      <line x1="0" y1="-95" x2="0" y2="-88"/>
      <line x1="67.2" y1="-67.2" x2="62" y2="-62"/>
      <line x1="95" y1="0" x2="88" y2="0"/>
      <line x1="67.2" y1="67.2" x2="62" y2="62"/>
      <line x1="0" y1="95" x2="0" y2="88"/>
      <line x1="-67.2" y1="67.2" x2="-62" y2="62"/>
      <line x1="-95" y1="0" x2="-88" y2="0"/>
      <line x1="-67.2" y1="-67.2" x2="-62" y2="-62"/>
    </g>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#1e3050" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 4"/>

    <!-- Outer diamond (red/coral) -->
    <polygon points="0,-65 55,15 0,70 -55,15" fill="none" stroke="url(#shieldGrad1)" stroke-width="2" opacity="0.8"/>

    <!-- Middle diamond (purple) -->
    <polygon points="0,-45 40,10 0,50 -40,10" fill="none" stroke="url(#shieldGrad2)" stroke-width="2" opacity="0.8"/>

    <!-- Inner diamond (cyan) - shield shape -->
    <polygon points="0,-28 25,5 0,32 -25,5" fill="none" stroke="url(#shieldGrad3)" stroke-width="2"/>

    <!-- Innermost chevron / V shape -->
    <polyline points="-15,-2 0,15 15,-2" fill="none" stroke="#00f7ff" stroke-width="2" filter="url(#glowCyan)"/>

    <!-- Center dot -->
    <circle cx="0" cy="3" r="3" fill="#febc2e" opacity="0.9"/>

    <!-- Cross-hair lines -->
    <line x1="0" y1="-80" x2="0" y2="-70" stroke="#00f7ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="80" y1="0" x2="70" y2="0" stroke="#00f7ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="80" x2="0" y2="70" stroke="#00f7ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="-80" y1="0" x2="-70" y2="0" stroke="#00f7ff" stroke-width="0.8" opacity="0.5"/>

    <!-- Corner accent lines (top-right) -->
    <line x1="55" y1="-65" x2="75" y2="-65" stroke="#1e3050" stroke-width="0.8" opacity="0.5"/>
    <line x1="75" y1="-65" x2="75" y2="-45" stroke="#1e3050" stroke-width="0.8" opacity="0.5"/>
    <!-- Corner accent lines (bottom-right) -->
    <line x1="55" y1="65" x2="75" y2="65" stroke="#1e3050" stroke-width="0.8" opacity="0.5"/>
    <line x1="75" y1="45" x2="75" y2="65" stroke="#1e3050" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Bottom-right text -->
  <text x="1160" y="272" font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="10" fill="#4a6480" letter-spacing="2" text-anchor="end" opacity="0.7">DEFENSE · DISCOVERY · DOCUMENTATION</text>

  <!-- Subtle border glow at top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#tagGrad)" opacity="0.3"/>
  <!-- Subtle border glow at bottom -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#tagGrad)" opacity="0.15"/>
</svg>
